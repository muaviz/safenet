{% extends "layout.html" %}

{% block body %}
<body>
    <section class="relative py-24 overflow-hidden">
        <!-- Background Elements -->

        <!-- Content Container -->
        <div class="relative container mx-auto px-6">
            <div class="max-w-3xl mx-auto">
                <!-- Signup Form -->
                <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-xl p-12 text-center">
                    <h2 class="text-4xl md:text-5xl font-bold mb-6 ">
                        Create an Account
                    </h2>

                    <form action="/signup" method="POST" class="space-y-6">
                        <input type="text" name="username" placeholder="Username" class="w-full px-4 py-3 rounded-lg border border-gray-300 ">
                        <input type="email" name="email" placeholder="Email" class="w-full px-4 py-3 rounded-lg border border-gray-300 ">
                        <input type="password" name="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg border border-gray-300 ">
                        <button type="submit" class="w-full px-6 py-3 rounded-lg font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-300">
                            Sign Up
                        </button>
                    </form>
                    <p class="text-gray-600 mt-4">Already have an account? <a href="/login" class="font-semibold">Log in</a></p>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
