<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Safenet</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <link id="pagestyle" href="../assets/css/soft-ui-dashboard.css?v=1.1.0" rel="stylesheet" />
  <style>
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      padding: 20px;
    }
    .gauge-container {
      width: 200px;
      height: 100px;
      position: relative;
      overflow: hidden;
    }
    .gauge {
      width: 200px;
      height: 100px;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
      background: #ddd;
      position: absolute;
      bottom: 0;
    }
    .gauge-fill {
      width: 200px;
      height: 100px;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
      background: #4caf50;
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
      transform: rotate(0deg);
      transition: transform 0.5s ease-in-out;
    }
    .gauge-value {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      bottom: 10px;
    }
  </style>
</head>

<body class="g-sidenav-show bg-gray-100">
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <div class="dashboard-container">
      <div class="card">
        <div class="card-header pb-0">
          <h6>Screen Time</h6>
        </div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <div class="gauge-container">
            <div class="gauge">
              <div class="gauge-fill" id="gaugeFill"></div>
            </div>
            <div class="gauge-value" id="gaugeValue">69%</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header pb-0">
          <h6>Block Websites</h6>
        </div>
        <div class="card-body">
          <form id="block-website-form">
            <div class="form-group">
              <input type="text" class="form-control" id="website-url" placeholder="Enter website URL">
            </div>
            <button type="submit" class="btn btn-primary">Block Website</button>
          </form>
          <div id="blocked-websites-list" class="mt-3"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header pb-0">
          <h6>Family Activities</h6>
        </div>
        <div class="card-body">
          <ul class="list-group">
            <li class="list-group-item">Child 1 - 2 hours on YouTube</li>
            <li class="list-group-item">Child 2 - 1 hour on Roblox</li>
            <li class="list-group-item">Parent - 30 minutes on Facebook</li>
          </ul>
        </div>
      </div>
    </div>
  </main>
  <script>
    function updateGauge(percentage) {
      const gaugeFill = document.getElementById("gaugeFill");
      const gaugeValue = document.getElementById("gaugeValue");
      const angle = (percentage / 100) * 180;
      gaugeFill.style.transform = `rotate(${angle}deg)`;
      gaugeValue.textContent = `${percentage}%`;
    }
    updateGauge(75);
    document.getElementById('block-website-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const websiteUrl = document.getElementById('website-url').value;
      if (websiteUrl) {
        const listItem = document.createElement('div');
        listItem.textContent = websiteUrl;
        document.getElementById('blocked-websites-list').appendChild(listItem);
        document.getElementById('website-url').value = '';
      }
    });
  </script>
</body>
</html>
