<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Safenet</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <link id="pagestyle" href="../assets/css/soft-ui-dashboard.css?v=1.1.0" rel="stylesheet" />
  <style>
    .dashboard-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      padding: 20px;
    }
    .gauge-container {
      width: 150px;
      height: 150px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gauge-svg {
      transform: rotate(-90deg);
    }
    .gauge-circle {
      fill: none;
      stroke-width: 10;
      stroke: #ddd;
    }
    .gauge-fill {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
      stroke: #4caf50;
      transition: stroke-dasharray 0.5s ease-in-out;
    }
    .gauge-value {
      position: absolute;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body class="g-sidenav-show bg-gray-100">
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <div class="dashboard-container">
      <div class="card">
        <div class="card-header pb-0">
          <h6>Screen Time</h6>
        </div>
        <div class="card-body d-flex align-items-center justify-content-center">
          <div class="gauge-container">
            <svg class="gauge-svg" width="150" height="150" viewBox="0 0 100 100">
              <circle class="gauge-circle" cx="50" cy="50" r="40" />
              <circle class="gauge-fill" cx="50" cy="50" r="40" stroke-dasharray="0 251.2" />
            </svg>
            <div class="gauge-value" id="gaugeValue">69%</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header pb-0">
          <h6>Block Websites</h6>
        </div>
        <div class="card-body">
          <form id="block-website-form">
            <div class="form-group">
              <input type="text" class="form-control" id="website-url" placeholder="Enter website URL">
            </div>
            <button type="submit" class="btn btn-primary">Block Website</button>
          </form>
          <div id="blocked-websites-list" class="mt-3"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header pb-0">
          <h6>Family Activities</h6>
        </div>
        <div class="card-body">
          <ul class="list-group">
            <li class="list-group-item">Child 1 - 2 hours on YouTube</li>
            <li class="list-group-item">Child 2 - 1 hour on Roblox</li>
            <li class="list-group-item">Parent - 30 minutes of gooning session</li>
          </ul>
        </div>
      </div>
    </div>
  </main>
  <script>
    function updateGauge(percentage) {
      const gaugeFill = document.querySelector(".gauge-fill");
      const gaugeValue = document.getElementById("gaugeValue");
      const circumference = 251.2;
      const offset = ((100 - percentage) / 100) * circumference;
      gaugeFill.style.strokeDasharray = `${circumference - offset} ${circumference}`;
      gaugeValue.textContent = `${percentage}%`;
    }
    updateGauge(75);
    document.getElementById('block-website-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const websiteUrl = document.getElementById('website-url').value;
      if (websiteUrl) {
        const listItem = document.createElement('div');
        listItem.textContent = websiteUrl;
        document.getElementById('blocked-websites-list').appendChild(listItem);
        document.getElementById('website-url').value = '';
      }
    });
  </script>
</body>
</html>
