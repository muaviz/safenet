{% extends "layout.html" %}
{% block body %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 py-8">
    <main class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 px-4">
        <!-- Screen Time Card -->
        <div class="bg-white shadow-xl rounded-2xl p-8 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
            <div class="flex items-center space-x-3 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h6 class="text-xl font-semibold text-gray-800">Screen Time</h6>
            </div>
            <div class="flex justify-center items-center">
                <div class="relative">
                    <svg class="gauge-svg transform -rotate-90" width="180" height="180" viewBox="0 0 100 100">
                        <circle class="gauge-circle" cx="50" cy="50" r="40" 
                            stroke="#E5E7EB" stroke-width="8" fill="none"/>
                        <circle class="gauge-fill" cx="50" cy="50" r="40" 
                            stroke="#3B82F6" stroke-width="8" stroke-linecap="round" fill="none"
                            stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
                    </svg>
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 
                        text-3xl font-bold text-blue-600" id="gaugeValue">0%</div>
                </div>
            </div>
        </div>

        <!-- Block Websites Card -->
        <div class="bg-white shadow-xl rounded-2xl p-8 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
            <div class="flex items-center space-x-3 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <h6 class="text-xl font-semibold text-gray-800">Block Websites</h6>
            </div>
            <form id="block-website-form" class="space-y-4">
                <input type="text" 
                    class="w-full px-4 py-3 rounded-lg border-2 border-purple-100 focus:border-purple-400 
                    focus:ring-2 focus:ring-purple-200 outline-none transition-all text-gray-700"
                    id="website-url" placeholder="Enter website URL">
                <button type="submit" 
                    class="w-full bg-gradient-to-r from-purple-500 to-purple-600 text-white font-semibold 
                    py-3 px-4 rounded-lg hover:opacity-90 transition-all duration-200 flex items-center justify-center">
                    Add Website
                </button>
            </form>
            <div id="blocked-websites-list" class="mt-6 space-y-3"></div>
        </div>

        <!-- Family Activities Card (Full Width) -->
        <div class="bg-white shadow-xl rounded-2xl p-8 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 md:col-span-2">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <h6 class="text-xl font-semibold text-gray-800">Family Activities</h6>
                </div>
            </div>
            <div class="space-y-4">
                <!-- Activity Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="p-6 rounded-xl bg-gradient-to-r from-blue-50 to-blue-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-semibold text-blue-600">Child 1</span>
                            <span class="text-blue-500 font-semibold">2h</span>
                        </div>
                        <p class="text-gray-600">YouTube</p>
                    </div>
                    <div class="p-6 rounded-xl bg-gradient-to-r from-purple-50 to-purple-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-semibold text-purple-600">Child 2</span>
                            <span class="text-purple-500 font-semibold">1h</span>
                        </div>
                        <p class="text-gray-600">Roblox</p>
                    </div>
                    <div class="p-6 rounded-xl bg-gradient-to-r from-green-50 to-green-100">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-semibold text-green-600">Parent</span>
                            <span class="text-green-500 font-semibold">30m</span>
                        </div>
                        <p class="text-gray-600">Reading</p>
                    </div>
                </div>
                
                <!-- Add Member Button -->
                <a href="/add-member" class="mt-6 inline-flex items-center justify-center w-full bg-gradient-to-r from-indigo-500 to-indigo-600 text-white font-semibold 
                    py-3 px-4 rounded-lg hover:opacity-90 transition-all duration-200 space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>Add New Family Member</span>
                </a>
            </div>
        </div>
    </main>
</div>

<style>
    @keyframes slideIn {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .gauge-fill {
        transition: stroke-dashoffset 1s ease-in-out;
    }

    .slide-in {
        animation: slideIn 0.5s ease-out forwards;
    }
</style>

<script>
    // Gauge Animation
    function updateGauge(percentage) {
        const gaugeFill = document.querySelector(".gauge-fill");
        const gaugeValue = document.getElementById("gaugeValue");
        const circumference = 251.2;
        const offset = circumference - (percentage / 100) * circumference;
        gaugeFill.style.strokeDashoffset = offset;
        gaugeValue.textContent = `${percentage}%`;
    }

    // Initialize with 0% and animate to 75%
    setTimeout(() => updateGauge(75), 500);

    // Block Website Form
    document.getElementById('block-website-form').addEventListener('submit', function(event) {
        event.preventDefault();
        const websiteUrl = document.getElementById('website-url').value;
        if (websiteUrl) {
            const listItem = document.createElement('div');
            listItem.className = 'flex items-center justify-between p-4 rounded-lg bg-purple-50 text-gray-700 slide-in';
            listItem.innerHTML = `
                <span>${websiteUrl}</span>
                <button class="text-gray-400 hover:text-red-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            `;
            document.getElementById('blocked-websites-list').appendChild(listItem);
            document.getElementById('website-url').value = '';

            // Add remove functionality
            const removeBtn = listItem.querySelector('button');
            removeBtn.addEventListener('click', () => {
                listItem.style.opacity = '0';
                listItem.style.transform = 'translateY(-10px)';
                setTimeout(() => listItem.remove(), 300);
            });
        }
    });
</script>
{% endblock %}
