{% extends "layout.html" %}

{% block body %}
  <main class="w-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white shadow-md rounded-2xl p-6 card-hover">
      <h6 class="text-lg font-semibold mb-4">Screen Time</h6>
      <div class="flex justify-center">
        <svg class="gauge-svg" width="150" height="150" viewBox="0 0 100 100">
          <!-- Background Circle -->
          <circle class="gauge-circle" cx="50" cy="50" r="40" stroke="#E5E7EB" stroke-width="8" fill="none"/>
          <!-- Progress Circle -->
          <circle class="gauge-fill" cx="50" cy="50" r="40" stroke="#3B82F6" stroke-width="8" stroke-linecap="round" fill="none"
            stroke-dasharray="251.2" stroke-dashoffset="251.2" />
        </svg>
        <div class="gauge-value text-center text-xl font-bold text-gray-900" id="gaugeValue">0%</div>
        
        <script>
          function updateGauge(percentage) {
            const gaugeFill = document.querySelector(".gauge-fill");
            const gaugeValue = document.getElementById("gaugeValue");
            const circumference = 251.2;
            const offset = circumference - (percentage / 100) * circumference;
            
            gaugeFill.style.transition = "stroke-dashoffset 1s ease-in-out";
            gaugeFill.style.strokeDashoffset = offset;
            
            gaugeValue.textContent = `${percentage}%`;
          }
        
          // Initialize with 75%
          updateGauge(75);
        </script>
        
      </div>
    </div>
    <div class="bg-white shadow-md rounded-2xl p-6 card-hover">
      <h6 class="text-lg font-semibold mb-4">Block Websites</h6>
      <form id="block-website-form" class="space-y-4">
        <input type="text" class="form-control text-gray-900" id="website-url" placeholder="Enter website URL">
        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Block Website</button>
      </form>
      <div id="blocked-websites-list" class="mt-3 text-sm text-gray-600"></div>
    </div>
     <div class="bg-white shadow-md rounded-2xl p-6 card-hover">
      <h6 class="text-lg font-semibold mb-4">Add Family Member</h6>
      <!-- <button class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded" onclick="generateQRCode()">Generate QR Code</button>
      <div id="qr-code" class="mt-4 flex justify-center"></div> -->
    </div>
    <div class="bg-white shadow-md rounded-2xl p-6 card-hover col-span-full">
      <h6 class="text-lg font-semibold mb-4">Family Activities</h6>
      <ul class="list-group list-group-flush">
        <li class="list-group-item bg-gray-200 text-gray-900">Child 1 - 2 hours on YouTube</li>
        <li class="list-group-item bg-gray-200 text-gray-900">Child 2 - 1 hour on Roblox</li>
        <li class="list-group-item bg-gray-200 text-gray-900">Parent - 30 minutes of reading</li>
      </ul>
    </div>
  </main>
  <script>
    document.getElementById('block-website-form').addEventListener('submit', function(event) {
      event.preventDefault();
      const websiteUrl = document.getElementById('website-url').value;
      if (websiteUrl) {
        const listItem = document.createElement('div');
        listItem.textContent = websiteUrl;
        listItem.classList.add('text-gray-900', 'p-2', 'rounded', 'bg-gray-200', 'mt-2');
        document.getElementById('blocked-websites-list').appendChild(listItem);
        document.getElementById('website-url').value = '';
      }
    });
    document.getElementById('profile-btn').addEventListener('click', function() {
      document.getElementById('profile-menu').classList.toggle('hidden');
    });
  </script>
{% endblock %}
