<!DOCTYPE html>
<html lang="en">
<head>
  <title>Safenet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.10.2/cdn.min.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='backend/assets/css/landing.css') }}">
</head>

<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center p-6">

  <!-- Flash Messages -->
  <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50">
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        {% for category, message in messages %}
          <div 
            x-data="{ show: true }" 
            x-show="show" 
            x-init="setTimeout(() => show = false, 3000)" 
            x-transition:leave="transition ease-in duration-500 opacity-100"
            x-transition:leave-end="opacity-0"
            class="px-4 py-2 mb-2 text-white rounded-lg shadow-lg transition-all duration-500
                   {% if category == 'success' %} bg-green-500 
                   {% elif category == 'error' %} bg-red-500 
                   {% else %} bg-blue-500 {% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <!-- Header -->
  <header class="w-full max-w-5xl flex justify-between items-center p-4 bg-white shadow-md rounded-lg mb-6">
    <h1 class="text-2xl font-bold text-blue-600">Safenet</h1>
    
    <!-- Profile Dropdown -->
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" class="flex items-center space-x-2 bg-gray-200 p-2 rounded-full hover:bg-gray-300">
        <i class="fas fa-user text-gray-700"></i>
      </button>
      
      <div x-show="open" @click.outside="open = false" 
           class="absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-md p-3">
        <a href="{{ url_for('logout') }}" class="block w-full text-left px-4 py-2 hover:bg-gray-100">
          Logout
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow">
    {% block body %}
    {% endblock %}
  </main>

</body>
</html>
