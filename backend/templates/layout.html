<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safenet</title>
    
    <!-- External Stylesheets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Script -->
    <script src="../static/index.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center p-6">
    
    <!-- Header Section -->
    <header class="w-full max-w-5xl flex justify-between items-center p-4 bg-white shadow-md rounded-lg mb-6">
        <h1 class="text-2xl font-bold text-blue-600">Safenet</h1>
        
        <!-- Profile Button & Dropdown -->
        <div class="relative">
            <button id="profile-btn" class="flex items-center space-x-2 bg-gray-200 p-2 rounded-full hover:bg-gray-300">
                <i class="fas fa-user text-gray-700"></i>
            </button>
            
            <!-- Dropdown Menu -->
            <div id="profile-menu" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-md p-3">
                <button class="w-full text-left px-4 py-2 hover:bg-gray-100">Login</button>
            </div>
        </div>
    </header>

    <!-- Main Content Block -->
    <main class="flex-grow w-full max-w-5xl">
        {% block body %}
        <!-- Individual page content will be injected here -->
        {% endblock %}
    </main>
    
    <!-- Footer (Add if needed) -->
</body>
</html>
