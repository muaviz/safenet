{% extends "layout.html" %}

{% block body %}
<div class="flex items-center justify-center min-h-screen bg-gradient-to-r from-blue-200 via-blue-100 to-blue-200 transition-all duration-500">
  <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 bg-white shadow-lg rounded-2xl overflow-hidden animate-fade-in">
    
    <!-- Left Side - Login -->
    <div class="p-8 flex flex-col justify-center items-center bg-gradient-to-r from-blue-400 to-blue-500 text-white transition-all duration-500">
      <h2 class="text-2xl font-bold mb-4">Welcome Back!</h2>
      <p class="text-sm mb-6">Login to continue where you left off</p>
      <form class="w-full max-w-sm">
        <input type="email" placeholder="Email" class="w-full p-3 mb-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300">
        <input type="password" placeholder="Password" class="w-full p-3 mb-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300">
        <button class="w-full bg-white text-blue-500 font-semibold py-2 px-4 rounded-lg hover:bg-gray-100 transition-all duration-300">Login</button>
      </form>
      <p class="text-sm mt-4">New here? <a href="#" class="underline">Sign up</a></p>
    </div>

    <!-- Right Side - Signup -->
    <div class="p-8 flex flex-col justify-center items-center bg-gray-50 transition-all duration-500">
      <h2 class="text-2xl font-bold mb-4 text-blue-500">Join Safenet Today</h2>
      <p class="text-sm mb-6 text-gray-700">Create an account and explore new possibilities</p>
      <form class="w-full max-w-sm">
        <input type="text" placeholder="Full Name" class="w-full p-3 mb-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300">
        <input type="email" placeholder="Email" class="w-full p-3 mb-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300">
        <input type="password" placeholder="Password" class="w-full p-3 mb-3 rounded-lg border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300">
        <button class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition-all duration-300">Sign Up</button>
      </form>
      <p class="text-sm mt-4 text-gray-600">Already have an account? <a href="#" class="text-blue-500 underline">Login</a></p>
    </div>

  </div>
</div>

<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fade-in {
    animation: fade-in 1s ease-in-out;
  }
</style>

{% endblock %}
