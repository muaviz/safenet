{% extends "layout.html" %}
{% block body %}
<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-100 via-blue-50 to-blue-100 transition-all duration-500 p-4">
  <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 bg-white shadow-2xl rounded-3xl overflow-hidden animate-fade-in">
    
    <!-- Left Side - Login -->
    <div class="p-12 flex flex-col justify-center items-center bg-gradient-to-br from-blue-500 to-blue-600 text-white transition-all duration-500 relative overflow-hidden">
      <div class="absolute inset-0 bg-blue-400 opacity-20 transform rotate-45 scale-150"></div>
      <div class="relative z-10">
        <h2 class="text-3xl font-bold mb-4 transition-transform hover:scale-105">Welcome Back!</h2>
        <p class="text-sm mb-8 text-blue-100">Login to continue where you left off</p>
        <form method="POST" action="/" class="w-full max-w-sm space-y-4">
          <input type="hidden" name="form_type" value="login">
          <div class="transform transition-all duration-300 hover:-translate-y-1">
            <input type="email" name="email" placeholder="Email" required 
              class="w-full p-4 rounded-xl border-2 border-blue-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all duration-300 hover:shadow-md">
          </div>
          <div class="transform transition-all duration-300 hover:-translate-y-1">
            <input type="password" name="password" placeholder="Password" required 
              class="w-full p-4 rounded-xl border-2 border-blue-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all duration-300 hover:shadow-md">
          </div>
          <button class="w-full bg-white text-blue-600 font-semibold py-4 px-6 rounded-xl hover:bg-blue-50 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-lg active:scale-95">
            Login
          </button>
        </form>
      </div>
    </div>
    
    <!-- Right Side - Signup -->
    <div class="p-12 flex flex-col justify-center items-center bg-gray-50 transition-all duration-500">
      <h2 class="text-3xl font-bold mb-4 text-blue-600 transition-transform hover:scale-105">Join Safenet Today</h2>
      <p class="text-sm mb-8 text-gray-600">Create an account and explore new possibilities</p>
      <form method="POST" action="/" class="w-full max-w-sm space-y-4">
        <input type="hidden" name="form_type" value="signup">
        <div class="transform transition-all duration-300 hover:-translate-y-1">
          <input type="text" name="name" placeholder="Full Name" required 
            class="w-full p-4 rounded-xl border-2 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all duration-300 hover:shadow-md">
        </div>
        <div class="transform transition-all duration-300 hover:-translate-y-1">
          <input type="email" name="email" placeholder="Email" required 
            class="w-full p-4 rounded-xl border-2 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all duration-300 hover:shadow-md">
        </div>
        <div class="transform transition-all duration-300 hover:-translate-y-1">
          <input type="password" name="password" placeholder="Password" required 
            class="w-full p-4 rounded-xl border-2 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all duration-300 hover:shadow-md">
        </div>
        <div class="transform transition-all duration-300 hover:-translate-y-1">
          <input type="password" name="confirm_password" placeholder="Confirm Password" required 
            class="w-full p-4 rounded-xl border-2 border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent transition-all duration-300 hover:shadow-md">
        </div>
        <button class="w-full bg-blue-600 text-white font-semibold py-4 px-6 rounded-xl hover:bg-blue-700 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-lg active:scale-95">
          Sign Up
        </button>
      </form>
    </div>
  </div>
</div>

<style>
  @keyframes fade-in {
    from { 
      opacity: 0; 
      transform: translateY(-20px); 
    }
    to { 
      opacity: 1; 
      transform: translateY(0); 
    }
  }
  
  .animate-fade-in { 
    animation: fade-in 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  input::placeholder {
    color: #94a3b8;
    opacity: 0.8;
  }
  
  input:focus::placeholder {
    opacity: 0.5;
  }
</style>
{% endblock %}
